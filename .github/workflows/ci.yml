name: CI

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rigtracker
          POSTGRES_PASSWORD: rigtracker
          POSTGRES_DB: rigtracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rigtracker"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://rigtracker:rigtracker@127.0.0.1:5432/rigtracker_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
