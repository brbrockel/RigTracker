# Local development services. Start with `pnpm dev:services`.
# An uncommon host port, bound to localhost only, so nothing collides with apps on this machine.
name: rigtracker-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: rigtracker
      POSTGRES_PASSWORD: rigtracker
      POSTGRES_DB: rigtracker
    ports:
      - '127.0.0.1:15433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rigtracker']
      interval: 5s
      retries: 10

volumes:
  postgres-data:
    # Explicit dev-only name; production uses its own volume.
    name: rigtracker_dev_postgres-data
